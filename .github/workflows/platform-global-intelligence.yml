name: Update global procurement and intelligence

on:
  schedule:
    - cron: "27 9 * * *"
  workflow_dispatch:
    inputs:
      uk_start:
        description: "Optional inclusive Find a Tender updated date (YYYY-MM-DD)"
        required: false
      uk_end:
        description: "Optional inclusive Find a Tender updated date (YYYY-MM-DD)"
        required: false

permissions:
  contents: read

concurrency:
  group: global-platform-ingestion
  cancel-in-progress: false

jobs:
  uk-find-a-tender:
    runs-on: ubuntu-latest
    env:
      PLATFORM_DATABASE_DIRECT_URL: ${{ secrets.PLATFORM_DATABASE_DIRECT_URL }}
      UK_START: ${{ inputs.uk_start }}
      UK_END: ${{ inputs.uk_end }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production database secret
        run: test -n "$PLATFORM_DATABASE_DIRECT_URL" || { echo "PLATFORM_DATABASE_DIRECT_URL is required"; exit 2; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r platform/requirements.txt
      - run: python platform/scripts/manage_db.py migrate
      - name: Import official Find a Tender OCDS releases
        working-directory: platform
        run: |
          if [ -n "$UK_START" ] || [ -n "$UK_END" ]; then
            test -n "$UK_START" && test -n "$UK_END" || { echo "uk_start and uk_end must be provided together"; exit 2; }
            python -m ingestion uk-sync --start "$UK_START" --end "$UK_END"
          else
            python -m ingestion uk-sync
          fi

  intelligence:
    runs-on: ubuntu-latest
    env:
      PLATFORM_DATABASE_DIRECT_URL: ${{ secrets.PLATFORM_DATABASE_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production database secret
        run: test -n "$PLATFORM_DATABASE_DIRECT_URL" || { echo "PLATFORM_DATABASE_DIRECT_URL is required"; exit 2; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r platform/requirements.txt
      - run: python platform/scripts/manage_db.py migrate
      - name: Backtest, predict, and score momentum
        working-directory: platform
        run: |
          status=0
          python -m intelligence backtest --type new_award || status=1
          python -m intelligence backtest --type contract_change || status=1
          python -m intelligence predict --type new_award || status=1
          python -m intelligence predict --type contract_change || status=1
          python -m intelligence momentum || status=1
          exit "$status"
