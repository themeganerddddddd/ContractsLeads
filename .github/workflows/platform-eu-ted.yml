name: Update EU TED procurement

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional inclusive TED publication date (YYYY-MM-DD)"
        required: false
      end_date:
        description: "Optional inclusive TED publication date (YYYY-MM-DD)"
        required: false
      max_records:
        description: "Optional bounded Search API validation limit"
        required: false
      bulk_year:
        description: "Optional official monthly XML package year"
        required: false
      bulk_month:
        description: "Optional official monthly XML package month (1-12)"
        required: false

permissions:
  contents: read

concurrency:
  group: production-procurement-ingestion
  cancel-in-progress: false

jobs:
  ted:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PLATFORM_DATABASE_DIRECT_URL: ${{ secrets.PLATFORM_DATABASE_DIRECT_URL }}
      DATABASE_CAPACITY_BYTES: "1073741824"
      DATABASE_CAPACITY_WARNING_FRACTION: "0.60"
      DATABASE_CAPACITY_STOP_FRACTION: "0.72"
      DATABASE_CAPACITY_CRITICAL_FRACTION: "0.90"
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      MAX_RECORDS: ${{ inputs.max_records }}
      BULK_YEAR: ${{ inputs.bulk_year }}
      BULK_MONTH: ${{ inputs.bulk_month }}
      BACKFILL_CACHE_DIR: ${{ runner.temp }}/federal-ledger-ted
      BACKFILL_MAX_DOWNLOAD_BYTES: "1073741824"
    steps:
      - uses: actions/checkout@v4
      - name: Require production database secret
        run: test -n "$PLATFORM_DATABASE_DIRECT_URL" || { echo "PLATFORM_DATABASE_DIRECT_URL is required"; exit 2; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r platform/requirements.txt
      - run: python platform/scripts/manage_db.py migrate
      - name: Import official TED data
        working-directory: platform
        run: |
          if [ -n "$BULK_YEAR" ] || [ -n "$BULK_MONTH" ]; then
            test -n "$BULK_YEAR" && test -n "$BULK_MONTH" || { echo "bulk_year and bulk_month must be provided together"; exit 2; }
            args=(eu-backfill --year "$BULK_YEAR" --month "$BULK_MONTH" --cache-dir "$BACKFILL_CACHE_DIR")
            if [ -n "$MAX_RECORDS" ]; then args+=(--max-records "$MAX_RECORDS"); fi
            python -m ingestion "${args[@]}"
          elif [ -n "$START_DATE" ] || [ -n "$END_DATE" ]; then
            test -n "$START_DATE" && test -n "$END_DATE" || { echo "start_date and end_date must be provided together"; exit 2; }
            args=(eu-sync --historical --start "$START_DATE" --end "$END_DATE")
            if [ -n "$MAX_RECORDS" ]; then args+=(--limit "$MAX_RECORDS"); fi
            python -m ingestion "${args[@]}"
          else
            python -m ingestion eu-sync
          fi
