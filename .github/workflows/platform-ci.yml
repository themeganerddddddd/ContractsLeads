name: Test national platform

on:
  push:
    paths:
      - "platform/**"
      - "pytest.ini"
      - ".github/workflows/platform-*.yml"
  pull_request:
    paths:
      - "platform/**"
      - "pytest.ini"
      - ".github/workflows/platform-*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: federal_intel
          POSTGRES_USER: federal_intel
          POSTGRES_PASSWORD: federal_intel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U federal_intel -d federal_intel"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://federal_intel:federal_intel@localhost:5432/federal_intel
      DEV_AUTH: "true"
      DEV_PLAN: pro
      DEV_STRIPE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r requirements.txt -r platform/requirements.txt
      - run: python platform/scripts/manage_db.py migrate
      - run: python platform/scripts/manage_db.py seed
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: platform/web/package-lock.json }
      - working-directory: platform/web
        run: npm ci
      - working-directory: platform/web
        run: npm test
      - working-directory: platform/web
        run: npm run typecheck
      - working-directory: platform/web
        run: npm run build
