name: Backfill national contract history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive action date (YYYY-MM-DD); run one fiscal year at a time"
        required: true
      end_date:
        description: "Inclusive action date (YYYY-MM-DD)"
        required: true
      max_records:
        description: "Optional bounded validation limit; leaves the job partial"
        required: false

permissions:
  contents: read

concurrency:
  group: production-procurement-ingestion
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PLATFORM_DATABASE_DIRECT_URL: ${{ secrets.PLATFORM_DATABASE_DIRECT_URL }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      MAX_RECORDS: ${{ inputs.max_records }}
      BACKFILL_CACHE_DIR: ${{ runner.temp }}/federal-ledger-backfill
      INGESTION_BATCH_SIZE: "1000"
      DATABASE_CAPACITY_BYTES: "1073741824"
      DATABASE_CAPACITY_WARNING_FRACTION: "0.60"
      DATABASE_CAPACITY_STOP_FRACTION: "0.72"
      DATABASE_CAPACITY_CRITICAL_FRACTION: "0.90"
    steps:
      - uses: actions/checkout@v4
      - name: Require production database secret
        run: test -n "$PLATFORM_DATABASE_DIRECT_URL" || { echo "PLATFORM_DATABASE_DIRECT_URL is required"; exit 2; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r platform/requirements.txt
      - run: python platform/scripts/manage_db.py migrate
      - working-directory: platform
        run: |
          python - <<'PY'
          import os
          from datetime import date
          start=date.fromisoformat(os.environ["START_DATE"])
          end=date.fromisoformat(os.environ["END_DATE"])
          if end < start: raise SystemExit("end_date must not precede start_date")
          PY
          args=(--start "$START_DATE" --end "$END_DATE")
          if [ -n "$MAX_RECORDS" ]; then
            case "$MAX_RECORDS" in (*[!0-9]*) echo "max_records must be a positive integer"; exit 2;; esac
            test "$MAX_RECORDS" -gt 0
            args+=(--max-records "$MAX_RECORDS")
          fi
          python -m ingestion backfill "${args[@]}"
