name: Reconcile national contract history

on:
  schedule:
    - cron: "17 11 * * 0"
  workflow_dispatch:
    inputs:
      days:
        description: "Action-date lookback window"
        required: true
        default: "30"

permissions:
  contents: read

concurrency:
  group: national-platform-ingestion
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      PLATFORM_DATABASE_DIRECT_URL: ${{ secrets.PLATFORM_DATABASE_DIRECT_URL }}
      RECONCILE_DAYS: ${{ inputs.days || '30' }}
    steps:
      - uses: actions/checkout@v4
      - name: Require production database secret
        run: test -n "$PLATFORM_DATABASE_DIRECT_URL" || { echo "PLATFORM_DATABASE_DIRECT_URL is required"; exit 2; }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r platform/requirements.txt
      - run: python platform/scripts/manage_db.py migrate
      - working-directory: platform
        run: |
          case "$RECONCILE_DAYS" in (*[!0-9]*|'') echo "days must be a positive integer"; exit 2;; esac
          test "$RECONCILE_DAYS" -gt 0
          python -m ingestion reconcile --days "$RECONCILE_DAYS"
