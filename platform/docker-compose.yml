services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: federal_intel
      POSTGRES_USER: federal_intel
      POSTGRES_PASSWORD: federal_intel
    ports:
      - "5432:5432"
    volumes:
      - federal_intel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U federal_intel -d federal_intel"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  federal_intel_pgdata:
